version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - npm install -g pnpm@10.20.0
        - pnpm config set store-dir .pnpm-store
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .pnpm-store/**/*
